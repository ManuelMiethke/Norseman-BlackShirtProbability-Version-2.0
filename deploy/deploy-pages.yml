# Builds the React dashboard (frontend/) and publishes it on GitHub Pages.
#
# One-time setup on GitHub: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that every push to main redeploys the site:
# https://manuelmiethke.github.io/Norseman-BlackShirtProbability-Version-2.0/
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # prebuild runs scripts/prepare-data.mjs (trimmed CSVs, no athlete names),
      # postbuild copies index.html to 404.html so deep links work on Pages.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
